name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Warnings fail too (--max-warnings 0 in the lint script).
      - run: npm run lint
      # Locale parity, project registry consistency, language routing. No server needed.
      - run: npm test
      - run: npm run build
      # Every text pair must clear WCAG contrast in both themes.
      - run: node scripts/contrast-report.mjs
      # Lighthouse budget against the production build (mobile emulation).
      # The performance floor is 55, not 80: the score is CPU-bound and the
      # shared runner is slower than a laptop. Measured on the home page after
      # the performance pass (Lighthouse + Chrome pinned with taskset, server
      # unpinned): 87-90 unpinned on a 12-core machine, 78-85 on two cores,
      # 70-80 on one core, where blocking time is 0.3-0.5 s. The last run on
      # this runner measured 1.5 s of blocking time, three times the one-core
      # figure; with this build's LCP (3.5-4 s simulated) and zero layout
      # shift, Lighthouse's scoring curves put that at about 61-64. 55 leaves
      # room under that worst case so the job does not flake, and still fails
      # on a real regression (a blocking script, a layout shift, a hidden LCP
      # element). Raise it once a few runs here have shown the real score.
      # Chrome ships on ubuntu-latest; chrome-launcher finds it on its own.
      # The same server first answers the site checks: every sitemap URL renders
      # in the right language with canonical, hreflang and share tags intact.
      # Then the browser smoke test (timezone, blocked storage, language switch).
      # Both suites fail rather than skip in CI when the server or Chrome is missing.
      - name: Site checks, browser smoke test and Lighthouse budget
        run: |
          npx next start -p 4310 &
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:4310 >/dev/null; do sleep 1; done'
          BASE_URL=http://127.0.0.1:4310 npm run test:site
          BASE_URL=http://127.0.0.1:4310 npm run test:browser
          node scripts/lighthouse.mjs http://127.0.0.1:4310/ "mobile /" --min-perf 55 --min-a11y 95 --min-seo 100 --min-bp 100
