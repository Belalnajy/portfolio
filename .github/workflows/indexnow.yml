name: IndexNow

# Vercel reports each deployment back to GitHub. When a production deploy
# goes live, tell Bing/Yandex/Naver/Seznam which pages changed (sitemap
# lastmod in the last 7 days) so they recrawl now instead of eventually.
on:
  deployment_status:

jobs:
  ping:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
